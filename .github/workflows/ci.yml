name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build local app
        run: ./scripts/build.sh
      - name: Run tests without private fixtures
        run: ./scripts/test.sh
      - name: Verify bundle
        run: |
          plutil -lint '.build/Vroma Cut.app/Contents/Info.plist'
          codesign --verify --strict '.build/Vroma Cut.app'
      - name: Reject binary and private fixture paths in Git
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(artifacts|\.build)/|\.(app/|a$|dylib$|dmg$|pkg$|mp4$|mov$|gpx$|marks\.csv$|p12$|p8$)'; then
            echo 'Binary or private fixture path found in Git.' >&2
            exit 1
          fi
